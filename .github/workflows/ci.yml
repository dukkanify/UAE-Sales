name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: ATPL PASS
      NEXT_PUBLIC_APP_ENV: development
      AUTH_SECRET: ci-auth-secret-at-least-24-chars
      ENABLE_DEMO_OTP: "true"
      DEMO_OTP_CODE: "123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit (non-blocking summary)
        run: npm audit --omit=dev --audit-level=critical || true
      - name: Production checklist doc present
        run: test -f docs/PRODUCTION_CHECKLIST.md && test -f docs/PRODUCTION.md

  preview-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branch naming
        run: |
          echo "PR from ${{ github.head_ref }}"
          test -n "${{ github.head_ref }}"
