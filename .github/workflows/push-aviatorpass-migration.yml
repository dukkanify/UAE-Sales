name: Push AviatorPass Migration

# One-time cutover: push mirror branches → dukkanify/AviatorPass
# Requires repository secret AVIATORPASS_PUSH_TOKEN (classic PAT, repo scope on AviatorPass).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Validate push token
        env:
          AVIATORPASS_PUSH_TOKEN: ${{ secrets.AVIATORPASS_PUSH_TOKEN }}
        run: |
          if [ -z "$AVIATORPASS_PUSH_TOKEN" ]; then
            echo "::error::Missing AVIATORPASS_PUSH_TOKEN. Add a classic PAT with repo scope for dukkanify/AviatorPass."
            exit 1
          fi

      - name: Push mirror branches to AviatorPass
        env:
          AVIATORPASS_PUSH_TOKEN: ${{ secrets.AVIATORPASS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch aviatorpass-dedicated-main \
            "https://x-access-token:${AVIATORPASS_PUSH_TOKEN}@github.com/dukkanify/UAE-Sales.git" \
            /tmp/ap-push
          cd /tmp/ap-push
          git remote add aviatorpass "https://x-access-token:${AVIATORPASS_PUSH_TOKEN}@github.com/dukkanify/AviatorPass.git"
          git push -u aviatorpass HEAD:main
          git fetch origin aviatorpass-dedicated-aviatorpass:refs/heads/aviatorpass
          git push aviatorpass aviatorpass:aviatorpass
          git fetch origin aviatorpass-dedicated-develop:refs/heads/develop
          git push aviatorpass develop:develop
          echo "Pushed main, aviatorpass, develop"
          git log -1 --oneline main

      - name: Verify remote branches
        env:
          GH_TOKEN: ${{ secrets.AVIATORPASS_PUSH_TOKEN }}
        run: |
          gh api repos/dukkanify/AviatorPass/branches --jq '.[].name' | sort
          gh api repos/dukkanify/AviatorPass/commits/main --jq '.sha'
