name: Deploy AviatorPass Production

on:
  push:
    # New dedicated repo defaults to `main` (= AviatorPass production tip).
    # Keep `aviatorpass` for compatibility during cutover from UAE-Sales.
    branches: [main, aviatorpass]
  workflow_dispatch:

concurrency:
  group: deploy-aviatorpass-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production – aviatorpass
    steps:
      # AviatorPass-only hook — never fall back to a shared/Sooqna deploy hook.
      - name: Prefer Deploy Hook (instant production rebuild of aviatorpass tip)
        id: hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_AVIATORPASS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "hook=missing" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_AVIATORPASS_DEPLOY_HOOK configured."
            exit 0
          fi
          response="$(curl --silent --show-error --write-out '\n%{http_code}' -X POST "$DEPLOY_HOOK_URL")"
          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"
          echo "Deploy Hook HTTP $status"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Deploy Hook failed with HTTP $status"
            exit 1
          fi
          echo "hook=ok" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.hook.outputs.hook != 'ok'

      - uses: actions/setup-node@v4
        if: steps.hook.outputs.hook != 'ok'
        with:
          node-version: "22"
          cache: npm

      - name: Deploy with Vercel token
        if: steps.hook.outputs.hook != 'ok'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_AVIATORPASS_DEPLOY_HOOK (preferred) or VERCEL_TOKEN. Cannot promote AviatorPass without AviatorPass-specific Vercel credentials."
            exit 1
          fi
          npm install -g vercel@41.7.8
          npm ci
          # Hard-pin to the AviatorPass Vercel project — never sooqna / shared defaults.
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel link --yes --token="$VERCEL_TOKEN" --scope dukkanify-technology-llcs-projects --project aviatorpass
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi
          vercel build --prod --token="$VERCEL_TOKEN"
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope dukkanify-technology-llcs-projects)"
          echo "Deployed: $url"

      - name: Smoke production aliases
        if: always()
        run: |
          set -e
          sleep 15
          for host in https://aviatorpass.vercel.app https://dubai-test.blog; do
            echo "==== $host ===="
            code=$(curl -sS -o /tmp/body.html -w '%{http_code}' --max-time 45 "$host/" || echo fail)
            echo "HTTP $code"
            rg -o '/brand/logo[^"'\'' ]+' /tmp/body.html | sort -u || true
            curl -sS --max-time 30 "$host/api/public/brand" | head -c 500 || true
            echo
            curl -sS --max-time 30 "$host/api/health" | head -c 300 || true
            echo
          done
          if ! rg -q 'logo(-dark)?\.png' /tmp/body.html; then
            echo "::warning::Production aliases still serve non-PNG logos — Promote may still be required in Vercel if Production Branch is not aviatorpass."
          fi
